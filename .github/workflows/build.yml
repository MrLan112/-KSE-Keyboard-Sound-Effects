name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: KSE-Mod-1.21.1-1.21.4, java: 21 }
          - { project: KSE-Mod-1.21.5-1.21.8, java: 21 }
          - { project: KSE-Mod-1.21.9-1.21.11, java: 21 }
          - { project: KSE-Mod-26.1, java: 25 }
          - { project: KSE-Mod-26.2, java: 25 }
          - { project: KSE-Mod-26.3, java: 25 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar
