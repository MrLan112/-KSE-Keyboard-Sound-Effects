plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Audio decoder libraries used for custom sound import.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kse" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.x is unobfuscated: no mappings, no mod* configurations, no remapJar.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Audio decoders, bundled into the mod jar (jar-in-jar). SoundDecoder creates
	// them by name, so each library only adds its own format. "include" does not
	// pull in transitive dependencies, so everything is listed.
	// MP3 / MP2 / MP1
	include implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4")
	include implementation("com.googlecode.soundlibs:jlayer:1.0.1.4")
	include implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
	// OGG Vorbis
	include implementation("com.googlecode.soundlibs:vorbisspi:1.0.3.3")
	include implementation("com.googlecode.soundlibs:jorbis:0.0.17.4")
	// Opus (Ogg container + decoder) and Speex
	include implementation("org.gagravarr:vorbis-java-core:0.8")
	include implementation("io.github.jaredmdobson:concentus:1.0.2")
	include implementation("com.tianscar.javasound:javasound-speex:0.9.8")
	// FLAC, AAC / M4A, Apple Lossless, Monkey's Audio, WavPack, Shorten
	include implementation("com.tianscar.javasound:javasound-flac:1.4.1")
	include implementation("com.tianscar.javasound:javasound-aac:0.9.8")
	include implementation("com.tianscar.javasound:javasound-alac:0.2.3")
	include implementation("com.tianscar.javasound:javasound-ape:1.7.7")
	include implementation("com.tianscar.javasound:javasound-wavpack:1.4.2")
	include implementation("com.tianscar.javasound:javasound-shorten:3.6.2")
	include implementation("com.tianscar.javasound:javasound-resloader:0.1.3")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The Mod Menu API classes in this project are compile-time stubs only; the real
// ones come from Mod Menu at run time, so they must not end up in the mod jar.
tasks.withType(Jar).configureEach {
	exclude 'com/terraformersmc/**'
}
